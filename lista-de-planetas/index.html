<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador Star Wars</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1>Buscador Star Wars</h1>
    <p class="subtitle">Explora una galaxia muy, muy lejana</p>


    <section class="search-card">
      <div class="search-row">
        <div class="input-wrap">
          <input id="searchInput" type="text" placeholder="Buscar..." autocomplete="off">
        </div>


        <select id="category" aria-label="Categoría de búsqueda">
          <option value="personajes">Personajes</option>
          <option value="peliculas">Películas</option>
          <option value="naves">Naves</option>
          <option value="vehiculos">Vehículos</option>
          <option value="especies">Especies</option>
          <option value="planetas">Planetas</option>
        </select>


        <button id="searchBtn">Buscar</button>
      </div>


      <p class="hint">Escribe lo que buscas, elige una categoría y haz clic en un resultado para ver más información.</p>
    </section>


    <section id="results" class="results" aria-live="polite"></section>
  </main>


  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close" id="closeBtn" aria-label="Cerrar">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>


  <script src="script.js"></script>
</body>
</html>
