<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador Star Wars</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- AÑADIDO: 'div.page' para centrar todo el contenido vertical y horizontalmente -->
  <div class="page">
    <h1>Star Wars</h1>
    <p class="subtitle">EXPLORA LA GALAXIA</p>

    <!-- AÑADIDO: 'class="search-card"' para darle fondo de cristal translúcido al buscador -->
    <div class="search-card">
      
      <!-- AÑADIDO: 'class="search-row"' para alinear los campos y el botón en una fila -->
      <form id="formBuscador" class="search-row">
        
        <div class="input-wrap">
          <input type="text" id="inputNombre" placeholder="Escribe un nombre...">
        </div>

        <select id="selectCategoria">
          <option value="people">Personajes</option>
          <option value="planets">Planetas</option>
          <option value="starships">Naves</option>
        </select>

        <button type="submit">Buscar</button>
      </form>
      
      <p class="hint">Ingresa las primeras letras para filtrar en la SWAPI</p>
    </div>

    <!-- MODIFICADO: agregar 'class="results"' para CSS -->
    <div id="resultado" class="results"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
